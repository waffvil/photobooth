<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click sounds</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; padding: 32px 16px; font-family: "Arial Narrow", Arial, sans-serif; background: linear-gradient(#fff, #FFC6E6); min-height: 100vh; color: #111; }
    h1 { color: #FF00FB; font-weight: 400; font-size: 40px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #333; }
    .grid { display: grid; gap: 14px; max-width: 420px; }
    button { font: 700 20px "Arial Narrow", Arial, sans-serif; padding: 18px; background: #fff; border: 2px solid #111; box-shadow: 8px 8px 0 #FF79C8; cursor: pointer; text-align: left; }
    button:active { transform: translate(3px, 3px); box-shadow: 5px 5px 0 #FF79C8; }
    small { display: block; font-weight: 400; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Click sounds</h1>
  <p>Tap each one and tell me the number you like. Number 1 is the one the app uses now.</p>
  <div class="grid">
    <button data-n="1">1 <small>crisp, a little body (in use)</small></button>
    <button data-n="2">2 <small>short and bright</small></button>
    <button data-n="3">3 <small>tick</small></button>
    <button data-n="4">4 <small>very short, sharp</small></button>
    <button data-n="5">5 <small>soft select</small></button>
  </div>
  <script>
    // Preloaded so each tap plays straight away.
    const sounds = {};
    for (const b of document.querySelectorAll('button')) {
      const n = b.dataset.n;
      sounds[n] = new Audio(`assets/sounds/click-${n}.wav`);
      sounds[n].preload = 'auto';
      b.addEventListener('click', () => { const a = sounds[n]; a.currentTime = 0; a.play(); });
    }
  </script>
</body>
</html>
